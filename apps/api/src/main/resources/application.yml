spring:
  application:
    name: fixloop-api
  datasource:
    # Server-side JDBC only. Do not put the password or SSL options in the URL.
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:4}
      data-source-properties:
        # pgJDBC verifies both the issuing CA and the server hostname.
        sslmode: verify-full
        sslrootcert: ${DATABASE_SSL_ROOT_CERT:/run/secrets/supabase-ca.crt}
        "[ApplicationName]": fixloop-api
  flyway:
    # The hosted schema predates this app's Flyway history. Do not change it
    # automatically. Tests opt in only for their disposable database.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
